[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-cli"
version = "0.1.0"
description = "A tiny command-line todo manager with JSON storage."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
todo = "todo.cli:main"

[tool.setuptools]
packages = ["todo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
